<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNI BAND - Smart Emergency Wristband</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Interactive Preview -->
        <div class="preview-box">
            <div class="wristband-graphic" id="bandGraphic">
                <div class="screen">
                    <span style="font-size: 0.7rem; color: var(--primary-white);">GPS: OK</span>
                    <strong style="font-size: 1rem; margin: 2px 0;">OMNI</strong>
                    <span style="font-size: 0.65rem; color: #888;">98% BATT</span>
                </div>
            </div>
            <div class="size-tag" id="sizeDisplay">Selected Size: Small (140 mm)</div>
        </div>

        <!-- Customization & Order Panel -->
        <div class="product-panel">
            <h1>OMNI BAND</h1>
            <p class="subtitle">Smart safety wristband with GPS tracking and SOS emergency response.</p>

            <!-- Color Selection -->
            <div class="option-group">
                <div class="option-label">Choose Rubber Color: <span id="colorLabel">Teal Green</span></div>
                <div class="swatches">
                    <div class="swatch active" style="background: #0d9488;" onclick="selectColor('#0d9488', 'Teal Green', this)"></div>
                    <div class="swatch" style="background: #1e293b; border: 1px solid #475569;" onclick="selectColor('#1e293b', 'Matte Black', this)"></div>
                    <div class="swatch" style="background: #e2e8f0;" onclick="selectColor('#e2e8f0', 'Pure White', this)"></div>
                    <div class="swatch" style="background: #ef4444;" onclick="selectColor('#ef4444', 'Coral Red', this)"></div>
                </div>
            </div>

            <!-- Size Selection -->
            <div class="option-group">
                <div class="option-label">Choose Band Size</div>
                <div class="sizes">
                    <div class="size-btn active" onclick="selectSize('Small (140 mm)', this)">
                        Small
                        <small>140 - 165 mm</small>
                    </div>
                    <div class="size-btn" onclick="selectSize('Medium (180 mm)', this)">
                        Medium
                        <small>165 - 190 mm</small>
                    </div>
                    <div class="size-btn" onclick="selectSize('Large (210 mm)', this)">
                        Large
                        <small>190 - 220 mm</small>
                    </div>
                </div>
            </div>

            <!-- Order Button -->
            <button class="order-btn" id="orderBtn" onclick="goToOrderPage()">Order Now</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
