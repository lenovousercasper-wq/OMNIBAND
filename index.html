<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omni Band Product Selector</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #ff6f59; /* Orangey Coral Background */
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background-color: #0b1320; /* Dark inner container background */
      border-radius: 16px;
      padding: 40px;
      max-width: 1000px;
      width: 100%;
      display: flex;
      gap: 40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      color: #ffffff;
    }

    /* Left Side: Product Preview */
    .preview-card {
      flex: 1;
      background-color: #121c2d;
      border-radius: 12px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .band-display {
      width: 240px;
      height: 240px;
      border-radius: 50%;
      border: 28px solid #ffffff; /* Dynamic outer band color */
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
    }

    .screen {
      width: 110px;
      height: 110px;
      background-color: #000000;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .screen-gps {
      color: #00c896;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .screen-brand {
      color: #ffffff;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 0.5px;
    }

    .screen-batt {
      color: #7a8b9e;
      font-size: 10px;
      margin-top: 4px;
    }

    .size-indicator {
      margin-top: 30px;
      background-color: rgba(255, 255, 255, 0.08);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      color: #8fa0b5;
    }

    /* Right Side: Options & Details */
    .details {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #8fa0b5;
      font-size: 15px;
      line-height: 1.4;
      margin-bottom: 30px;
    }

    .section-divider {
      border: none;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 24px;
    }

    .option-label {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .selected-color-text {
      color: #ffffff;
      font-weight: bold;
    }

    /* Color Swatches Grid */
    .color-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 30px;
    }

    .color-swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.2s ease, border-color 0.2s ease;
      position: relative;
    }

    .color-swatch:hover {
      transform: scale(1.1);
    }

    .color-swatch.active {
      border-color: #ffffff;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.4);
    }

    /* Size Buttons Grid */
    .size-picker {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .size-card {
      background-color: #121c2d;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 16px 12px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .size-card.active {
      border-color: #00c896;
      background-color: rgba(0, 200, 150, 0.05);
    }

    .size-name {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .size-range {
      font-size: 12px;
      color: #6c7d93;
    }

    /* Mobile Responsiveness */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        padding: 24px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Left Section: Preview -->
    <div class="preview-card">
      <div class="band-display" id="bandPreview" style="border-color: #ffffff;">
        <div class="screen">
          <span class="screen-gps">GPS: OK</span>
          <span class="screen-brand">OMNI</span>
          <span class="screen-batt">98% BATT</span>
        </div>
      </div>
      <div class="size-indicator" id="sizeIndicator">Selected Size: Medium (180 mm)</div>
    </div>

    <!-- Right Section: Product Controls -->
    <div class="details">
      <h1 class="title">OMNI BAND</h1>
      <p class="subtitle">Smart safety wristband with GPS tracking and SOS emergency response.</p>
      
      <hr class="section-divider">

      <!-- Color Selector -->
      <div class="option-label">
        Choose Rubber Color: <span class="selected-color-text" id="colorText">White</span>
      </div>
      <div class="color-picker" id="colorPicker">
        <!-- JS generates color swatches here -->
      </div>

      <hr class="section-divider">

      <!-- Size Selector -->
      <div class="option-label">Choose Band Size</div>
      <div class="size-picker">
        <div class="size-card" onclick="selectSize('Small', '140 - 165 mm', this)">
          <div class="size-name">Small</div>
          <div class="size-range">140 - 165 mm</div>
        </div>
        <div class="size-card active" onclick="selectSize('Medium', '165 - 190 mm', this)">
          <div class="size-name">Medium</div>
          <div class="size-range">165 - 190 mm</div>
        </div>
        <div class="size-card" onclick="selectSize('Large', '190 - 220 mm', this)">
          <div class="size-name">Large</div>
          <div class="size-range">190 - 220 mm</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Requested Colors configuration
    const colors = [
      { name: 'Red', hex: '#E53E3E' },
      { name: 'Orange', hex: '#DD6B20' },
      { name: 'Yellow', hex: '#D69E2E' },
      { name: 'Teal', hex: '#319795' },
      { name: 'Blue', hex: '#3182CE' },
      { name: 'Navy Blue', hex: '#1A365D' },
      { name: 'Black', hex: '#1A202C' },
      { name: 'White', hex: '#FFFFFF' },
      { name: 'Purple', hex: '#805AD5' },
      { name: 'Pink', hex: '#D53F8C' }
    ];

    const colorPickerContainer = document.getElementById('colorPicker');
    const colorText = document.getElementById('colorText');
    const bandPreview = document.getElementById('bandPreview');

    // Populate Color Swatches
    colors.forEach((color, index) => {
      const swatch = document.createElement('div');
      swatch.classList.add('color-swatch');
      swatch.style.backgroundColor = color.hex;
      swatch.title = color.name;
      
      // Default selection to White
      if (color.name === 'White') {
        swatch.classList.add('active');
        colorText.style.color = color.hex;
      }

      // Border adjustments for white color swatch readability
      if (color.name === 'White') {
        swatch.style.border = '1px solid rgba(255,255,255,0.4)';
      }

      swatch.addEventListener('click', () => {
        document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
        swatch.classList.add('active');
        
        // Update label and band border color
        colorText.textContent = color.name;
        colorText.style.color = color.hex === '#FFFFFF' ? '#FFFFFF' : color.hex;
        bandPreview.style.borderColor = color.hex;
      });

      colorPickerContainer.appendChild(swatch);
    });

    // Size Selector Functionality
    function selectSize(sizeName, range, element) {
      document.querySelectorAll('.size-card').forEach(card => card.classList.remove('active'));
      element.classList.add('active');
      document.getElementById('sizeIndicator').textContent = `Selected Size: ${sizeName} (${range.split('-')[1].trim()})`;
    }
  </script>
</body>
</html>
