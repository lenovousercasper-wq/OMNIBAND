<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNI BAND - Smart Emergency Wristband</title>
    <style>
        :root {
            --primary-teal: #0d9488;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            transition: all 0.25s ease;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2.5rem;
            align-items: center;
        }

        /* Band Visual Preview */
        .preview-box {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .wristband-graphic {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            border: 22px solid var(--primary-teal);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(13, 148, 136, 0.3);
            position: relative;
        }

        .screen {
            background: #000;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .size-tag {
            position: absolute;
            bottom: 1rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Product Customization Panel */
        .product-panel h1 {
            font-size: 2.4rem;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .option-group {
            margin-bottom: 1.8rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 1.2rem;
        }

        .option-label {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 0.8rem;
        }

        .option-label span {
            color: var(--primary-teal);
        }

        /* Swatches & Size Buttons */
        .swatches {
            display: flex;
            gap: 1rem;
        }

        .swatch {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .swatch.active {
            border-color: #fff;
            transform: scale(1.1);
        }

        .sizes {
            display: flex;
            gap: 1rem;
        }

        .size-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-light);
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            flex: 1;
        }

        .size-btn.active {
            border-color: var(--primary-teal);
            background: rgba(13, 148, 136, 0.15);
        }

        .size-btn small {
            display: block;
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-top: 2px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Interactive Preview -->
        <div class="preview-box">
            <div class="wristband-graphic" id="bandGraphic">
                <div class="screen">
                    <span style="font-size: 0.7rem; color: var(--primary-teal);">GPS: OK</span>
                    <strong style="font-size: 1rem; margin: 2px 0;">OMNI</strong>
                    <span style="font-size: 0.65rem; color: #888;">98% BATT</span>
                </div>
            </div>
            <div class="size-tag" id="sizeDisplay">Selected Size: Small (140 mm)</div>
        </div>

        <!-- Customization Controls -->
        <div class="product-panel">
            <h1>OMNI BAND</h1>
            <p class="subtitle">Smart safety wristband with GPS tracking and SOS emergency response.</p>

            <!-- Color Selection -->
            <div class="option-group">
                <div class="option-label">Choose Rubber Color: <span id="colorLabel">Teal Green</span></div>
                <div class="swatches">
                    <div class="swatch active" style="background: #0d9488;" onclick="selectColor('#0d9488', 'Teal Green', this)"></div>
                    <div class="swatch" style="background: #1e293b; border: 1px solid #475569;" onclick="selectColor('#1e293b', 'Matte Black', this)"></div>
                    <div class="swatch" style="background: #e2e8f0;" onclick="selectColor('#e2e8f0', 'Pure White', this)"></div>
                    <div class="swatch" style="background: #ef4444;" onclick="selectColor('#ef4444', 'Coral Red', this)"></div>
                </div>
            </div>

            <!-- Size Selection -->
            <div class="option-group">
                <div class="option-label">Choose Band Size</div>
                <div class="sizes">
                    <div class="size-btn active" onclick="selectSize('Small (140 mm)', this)">
                        Small
                        <small>140 - 165 mm</small>
                    </div>
                    <div class="size-btn" onclick="selectSize('Medium (180 mm)', this)">
                        Medium
                        <small>165 - 190 mm</small>
                    </div>
                    <div class="size-btn" onclick="selectSize('Large (210 mm)', this)">
                        Large
                        <small>190 - 220 mm</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function selectColor(colorHex, colorName, element) {
            document.getElementById('bandGraphic').style.borderColor = colorHex;
            document.getElementById('colorLabel').textContent = colorName;
            
            document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
            element.classList.add('active');
        }

        function selectSize(sizeText, element) {
            document.getElementById('sizeDisplay').textContent = 'Selected Size: ' + sizeText;
            
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
            element.classList.add('active');
        }
    </script>
</body>
</html>
